# Proposed contract; no configuration parser is included.
[practice]
session_questions = 10
amounts_minor_units = [5000, 10000, 20000]
hint_retries = 1
mixed_review_fraction = 0.20

[mastery]
half_life_days = 3.0
minimum_selection_weight = 0.05

[tutor]
# Supported providers: "offline" (default), "chatgpt_plan", "anthropic", "google", "openai", or "lmstudio"
provider = "offline"
network_enabled = false
timeout_seconds = 20
max_requests_per_session = 5
# Optional model override (defaults chosen per provider):
# model = "claude-3-5-sonnet-latest"   # for anthropic
# model = "gemini-1.5-pro-latest"       # for google
# model = "gpt-4o"                      # for openai
#
# Credentials:
# - "chatgpt_plan": managed via TUI browser login (OAuth PKCE) and saved in local user data dir.
# - "anthropic", "google", "openai": read from ANTHROPIC_API_KEY, GEMINI_API_KEY, or OPENAI_API_KEY env vars,
#   or entered via TUI and stored securely in local user data dir. Never store secrets in tracked files or git.
# - "lmstudio": no key. Optional LM_API_TOKEN env var only if LM Studio authentication is enabled (never stored).
#
# Local LM Studio server (provider = "lmstudio"). Effective settings come from flags/env/TUI:
# [tutor.lmstudio]
# base_url = "http://localhost:1234/v1"   # LMSTUDIO_BASE_URL, --lmstudio-url, or [l] in Tutor Settings
# allow_remote = false                    # loopback hosts only unless --lmstudio-allow-remote / LMSTUDIO_ALLOW_REMOTE=1
# timeout_seconds = 90                    # minimum for LM Studio (cold model loads, CPU inference)
# max_tokens = 4096                       # --lmstudio-max-tokens; room for reasoning models to finish
#
# Streamed replies (all AI providers): timeout_seconds limits the wait for
# the first text only; after that a reply stops if no text arrives for 30 seconds.
# There is no streaming setting to change.
# model = ""                              # empty = first model the server reports; choose with [m] in Tutor Settings
